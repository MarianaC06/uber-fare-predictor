<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uber Fare Predictor</title><style>body{font-family:system-ui;background:#f3f6fa;color:#172337;margin:0}.wrap{max-width:680px;margin:50px auto;background:white;padding:32px;border-radius:16px;box-shadow:0 12px 40px #17233718}h1{margin-top:0}label{display:block;margin-top:14px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b9c5d3;border-radius:7px}button{margin-top:22px;background:#1254aa;color:white;border:0;border-radius:8px;padding:14px 20px;cursor:pointer}#result{margin-top:22px;font-size:18px}small{color:#52647c}</style></head><body><main class="wrap"><h1>🚗 Uber Fare Predictor</h1><p>Estimación académica del costo de un viaje en Nueva York con datos históricos.</p><form id="f"><label>Fecha y hora (UTC)<input name="pickup_datetime" type="datetime-local" value="2015-05-07T19:52" required></label><label>Latitud origen<input name="pickup_latitude" type="number" step="any" value="40.738354" required></label><label>Longitud origen<input name="pickup_longitude" type="number" step="any" value="-73.999817" required></label><label>Latitud destino<input name="dropoff_latitude" type="number" step="any" value="40.723217" required></label><label>Longitud destino<input name="dropoff_longitude" type="number" step="any" value="-73.999512" required></label><label>Pasajeros<input name="passenger_count" type="number" min="1" max="6" value="1" required></label><button>Calcular tarifa estimada</button></form><div id="result" role="status"></div><p><small>Modelo entrenado con datos históricos. No representa precios actuales ni cotizaciones oficiales.</small></p></main><script>document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.pickup_datetime+=':00Z';for(const k of Object.keys(d))if(k!=='pickup_datetime')d[k]=Number(d[k]);const r=document.querySelector('#result');r.textContent='Calculando...';try{const x=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await x.json();r.textContent=x.ok?`Tarifa estimada: $${j.estimated_fare_usd} USD · Distancia: ${j.distance_km} km`:`Error: ${JSON.stringify(j.detail)}`}catch(err){r.textContent='No se pudo conectar con el servidor.'}})</script></body></html>
